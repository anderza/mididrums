name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build player page
        run: python3 web/build.py

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/MidiDrums.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MidiDrums-apk
          path: out/MidiDrums.apk

      # a release per build gives a direct download link that opens on a phone
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Барабаны MIDI, сборка ${{ github.run_number }}
          files: out/MidiDrums.apk
          make_latest: true
